[project]
name = "env-dash"
version = "0.1.0"
description = ""
authors = [{ name = "Kuautli", email = "cuauhtemocbe@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas>=3.1.1,<4.0.0",
    "dash>=4.5.0,<5.0",
    "sentry-sdk>=2.75.0,<3.0.0",
]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.17.4,<0.18.0"
pytest = ">=9.2.0,<10.0.0"
mypy = ">=2.4.1,<3.0.0"
pandas-stubs = ">=3.1.0.261029"
pytest-cov = ">=6.0.0,<8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "PT018"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=app --cov=utils --cov=translations --cov-report=term-missing --cov-report=xml:tests/coverage.xml --cov-fail-under=80"

[tool.mypy]
mypy_path = "src"
